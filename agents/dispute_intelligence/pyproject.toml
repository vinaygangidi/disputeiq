[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uipath-dispute-intelligence-agent"
version = "0.1.0"
description = "Dispute Intelligence Agent for DisputeIQ - Stage 1 claim intake and risk scoring"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "DisputeIQ Team", email = "support@disputeiq.dev" }
]
requires-python = ">=3.11"

dependencies = [
    "langgraph>=0.2.0",
    "uipath-langchain>=0.1.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools]
packages = ["agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
